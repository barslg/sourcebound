name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run ruff check src tests migrations scripts
      - run: uv run ruff format --check src tests migrations scripts

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run mypy src

  tests:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muse
          POSTGRES_PASSWORD: muse
          POSTGRES_DB: muse
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U muse -d muse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://muse:muse@localhost:5434/muse_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest -m "not live"

  gates:
    name: mechanical gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muse
          POSTGRES_PASSWORD: muse
          POSTGRES_DB: muse
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U muse -d muse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://muse:muse@localhost:5434/muse_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest -m "not live" tests/gates/
      - run: uv run python scripts/run_gates.py

  mutation:
    name: mutation (changed lines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muse
          POSTGRES_PASSWORD: muse
          POSTGRES_DB: muse
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U muse -d muse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://muse:muse@localhost:5434/muse_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then base=origin/dev; fi
          uv run python scripts/mutate_changed.py --base "$base" --budget 540

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  public-tree:
    name: check_public_tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv run python scripts/check_public_tree.py

  frontend:
    name: check-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          if [ -f frontend/package.json ]; then
            make check-frontend
          else
            echo "no frontend/package.json; skipped"
          fi

  frontend-e2e:
    name: frontend e2e gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muse
          POSTGRES_PASSWORD: muse
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U muse -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: cd frontend && npm run e2e
