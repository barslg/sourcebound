# On a published release: build the two images the site runs (api and web) and publish them
# to the GitHub Container Registry as packages of this repository, tagged with the release tag
# and `latest`. Run by hand (workflow_dispatch) to republish the newest tag.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: publish images
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: frontend build (the web image serves dist/)
        run: cd frontend && npm ci && npm run build
      - name: tag
        id: tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then tag="$(git describe --tags --abbrev=0 2>/dev/null || echo latest)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/sourcebound-api:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/sourcebound-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Sourcebound API and worker (FastAPI, Procrastinate) on Meta models
            org.opencontainers.image.licenses=MIT
      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/sourcebound-web:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/sourcebound-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Sourcebound author and learner UI (Vue 3) behind nginx
            org.opencontainers.image.licenses=MIT
