# Gitleaks config: default rules plus repo-specific secret shapes.
# Scan: gitleaks detect --source . --config .gitleaks.toml --verbose
# (CI runs it over full history with fetch-depth: 0).

[extend]
useDefault = true

# Google OAuth client secret.
[[rules]]
id = "google-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[A-Za-z0-9_\-]{8,}'''
tags = ["oauth", "google"]

# Meta Model API key: a long LLM- token ...
[[rules]]
id = "meta-llm-token"
description = "Meta Model API key token"
regex = '''LLM-[A-Za-z0-9_\-]{24,}'''
tags = ["api-key", "meta"]

# ... or MODEL_API_KEY carrying a real-looking value. gitleaks uses RE2 (no
# lookahead), so the fixture words are excluded by the rule allowlist below.
[[rules]]
id = "meta-model-api-key-assignment"
description = "Meta Model API key assignment"
regex = '''(?i)model[_-]?api[_-]?key['"]?[ \t]*[:=][ \t]*['"]?([A-Za-z0-9_\-.~+/=]{16,})'''
secretGroup = 1
tags = ["api-key", "meta"]

# Values that start with a fixture word are not keys.
[[rules.allowlists]]
description = "fixture words in a MODEL_API_KEY assignment"
regexTarget = "secret"
regexes = ['''(?i)^(synthetic|test|fake|dummy|example|placeholder|xxx|redacted)''']

# The gate scripts and their tests name these shapes on purpose.
[[allowlists]]
description = "secret-shape fixtures in gates and their tests"
paths = [
  '''\.gitleaks\.toml$''',
  '''scripts/check_public_tree\.py$''',
  '''tests/gates/''',
]

# Two historical fixtures that look like keys. Both were rewritten in the tree
# (built at runtime); history is not rewritten, so the exact commits are named.
[[allowlists]]
description = "fixture values in the first test_redact.py and the Google OAuth redaction test (not keys)"
commits = [
  "bc6453b009523da2466ccafb7a88e97b70134061",
  "ccecef1c07c50f19a7620a88248a40642bade399",
]
