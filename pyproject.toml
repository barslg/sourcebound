[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grounded-course-studio"
version = "0.1.0"
description = "Grounded Course Studio backend: verified sources in, structured checkable course out."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "procrastinate>=2.14",
  "psycopg[binary,pool]>=3.1",
  "openai>=3.42,<4",
  "httpx>=0.27",
  "httpx2>=2.0",
  "structlog>=24.0",
  "python-multipart>=0.0.18",
  "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "live: calls the real Meta Model API and is skipped without MODEL_API_KEY",
]
