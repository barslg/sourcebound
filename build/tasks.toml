# Build ledger: one task per row, run by scripts/build.py. State = git log (a done task has a commit "build(ID): title").
# Resumable: if the runner or the API stops mid-task, the next run resumes the same task from the working tree.
[[task]]
id = "T01"
title = "day-1 backend harness: packaging, compose, layers, migration 0001, LLM layer, live smoke"
prompt = "tmp/task-bootstrap.md"
model = "muse-spark-1.3"
effort = "high"
max_steps = 500
depends = []

[[task]]
id = "T02"
title = "identity, RBAC catalogue, invites, ban/delete with heir, operations + SSE"
prompt = "build/tasks/T02.md"
model = "muse-spark-1.3"
effort = "high"
max_steps = 500
depends = ["T01"]

[[task]]
id = "T03"
title = "course model, sources with addressed passages, FTS retrieval, researcher/architect/estimator, resumable runs"
prompt = "build/tasks/T03.md"
model = "muse-spark-1.3"
effort = "high"
max_steps = 600
depends = ["T02", "T01b"]

[[task]]
id = "T01b"
title = "LLM-layer additions: effort and max_output_tokens per step, pending ledger row for background, variant, subject_user_id, config guards"
prompt = "build/tasks/T01b.md"
model = "muse-spark-1.3"
effort = "high"
max_steps = 300
depends = ["T02"]

[[task]]
id = "T05"
title = "Merrill pipeline end to end: methodology registry, seven block types, generators, reader, saboteur, resumable executor, find-the-error, prompts"
prompt = "build/tasks/T05.md"
model = "muse-spark-1.3"
effort = "high"
max_steps = 700
depends = ["T03", "T02b"]

[[task]]
id = "T07"
title = "full multilinguality: segment translation with code-owned structure, glossary-first, planted-error invariant, locale discipline"
prompt = "build/tasks/T07.md"
model = "muse-spark-1.3"
effort = "high"
max_steps = 500
depends = ["T05"]

[[task]]
id = "T02b"
title = "security fixes from the T02 review: sub-keyed accounts, verified superadmin, escalation on assign, student-only invites, scope enforcement, hashed tokens, worker imports, bans table"
prompt = "build/tasks/T02b.md"
model = "muse-spark-1.3"
effort = "high"
max_steps = 500
depends = ["T03"]
